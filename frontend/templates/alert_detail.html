{% extends "base.html" %}{% load static %}
{% block page_sub %}Evidence, timeline and investigation notes for one alert.{% endblock %}
{% block content %}
<div class="mb-3"><a href="{% url 'alerts' %}" class="small"><i class="bi bi-arrow-left"></i> Back to alerts</a></div>
<div id="alert-root" data-alert-id="{{ view.kwargs.alert_id }}">
  <div class="text-center p-5"><div class="spinner-border text-info"></div></div>
</div>

<div class="modal fade" id="resolveModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title" id="resolveTitle">Resolve alert</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <label class="form-label">Summary / reason (saved as an investigation note)</label>
    <textarea class="form-control" id="resolveText" rows="4" placeholder="What did you find? What was done?"></textarea>
  </div>
  <div class="modal-footer"><button class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button>
    <button class="btn btn-accent" id="resolveConfirm">Confirm</button></div>
</div></div></div>
{% endblock %}
{% block scripts %}<script src="{% static 'js/alert_detail.js' %}"></script>{% endblock %}
