# =====================================================================
# Distributed Cyber Threat Detection Using Hadoop - Docker Compose
# ---------------------------------------------------------------------
# Tuned for a 12 GB RAM laptop (steady state uses about 6-7 GB).
# Start everything:   docker compose up -d --build
# Watch progress:     docker compose ps    /   docker compose logs -f <service>
# =====================================================================

x-common-env: &common-env
  env_file: .env

services:

  # ---------------------------------------------------------------
  # Apache Kafka 3.7 (KRaft mode - no Zookeeper needed)
  # ---------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: dctd-kafka
    hostname: kafka
    ports:
      - "29092:29092"          # for tools running on your Windows/WSL host
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_LOG_RETENTION_HOURS: 24          # keep disk usage small
      KAFKA_LOG_RETENTION_BYTES: 536870912   # 512 MB per partition max
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 900m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Hadoop HDFS 3.3.6 (1 NameNode + 1 DataNode, replication = 1)
  # ---------------------------------------------------------------
  hdfs-volume-init:            # makes the HDFS volumes writable for the "hadoop" user
    image: busybox:1.36
    container_name: dctd-hdfs-volume-init
    command: ["sh", "-c", "chmod 777 /nn /dn && echo volumes ready"]
    volumes:
      - hdfs-name:/nn
      - hdfs-data:/dn
    restart: "no"

  namenode:
    image: apache/hadoop:3.3.6
    container_name: dctd-namenode
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"            # HDFS web UI: http://localhost:9870
    env_file: hadoop/configuration/hadoop.env
    environment:
      ENSURE_NAMENODE_DIR: "/hadoop/dfs/name"     # formatted automatically on first start
      HADOOP_HEAPSIZE_MAX: "384m"
    volumes:
      - hdfs-name:/hadoop/dfs
    depends_on:
      hdfs-volume-init:
        condition: service_completed_successfully
    mem_limit: 640m
    restart: unless-stopped

  datanode:
    image: apache/hadoop:3.3.6
    container_name: dctd-datanode
    hostname: datanode
    command: ["hdfs", "datanode"]
    env_file: hadoop/configuration/hadoop.env
    environment:
      HADOOP_HEAPSIZE_MAX: "384m"
    volumes:
      - hdfs-data:/hadoop/dfs
    depends_on:
      - namenode
    mem_limit: 640m
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Elasticsearch 8.13 (single node, security disabled for local use)
  # ---------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: dctd-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      # Low-disk laptops: stop ES from switching indices to read-only.
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    mem_limit: 1300m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  # ---------------------------------------------------------------
  # MongoDB 7 (users, roles, alert workflow, notes, audit log)
  # Small WiredTiger cache so it fits on a 12 GB RAM laptop.
  # View the data with MongoDB Compass:  mongodb://<user>:<password>@localhost:27017/?authSource=admin
  # ---------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: dctd-mongodb
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25", "--quiet"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-threat_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change_me_mongo_password}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-threatdb}
    ports:
      - "127.0.0.1:27017:27017"   # only reachable from your own PC (for Compass)
    volumes:
      - mongo-data:/data/db
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # ---------------------------------------------------------------
  # One-time initialisation: Kafka topics, ES indices, HDFS folders
  # ---------------------------------------------------------------
  init:
    <<: *common-env
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    image: dctd-python:latest
    container_name: dctd-init
    command: ["python", "/app/scripts/init_all.py"]
    volumes:
      - ./:/app
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      namenode:
        condition: service_started
      datanode:
        condition: service_started
    mem_limit: 256m
    restart: "no"

  # ---------------------------------------------------------------
  # Spark MLlib model training (runs once; skipped if models exist)
  # ---------------------------------------------------------------
  spark-train:
    <<: *common-env
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: dctd-spark:latest
    container_name: dctd-spark-train
    user: root               # needs write access to the mounted ./data folder
    command: ["bash", "/opt/app/spark/run_training.sh"]
    volumes:
      - ./:/opt/app
    depends_on:
      init:
        condition: service_completed_successfully
    mem_limit: 3g
    restart: "no"

  # ---------------------------------------------------------------
  # Spark Structured Streaming detection job
  # ---------------------------------------------------------------
  spark-streaming:
    <<: *common-env
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: dctd-spark:latest
    container_name: dctd-spark-streaming
    user: root
    hostname: spark-streaming
    command: ["bash", "/opt/app/spark/run_streaming.sh"]
    ports:
      - "4040:4040"            # Spark UI: http://localhost:4040
    volumes:
      - ./:/opt/app
    depends_on:
      spark-train:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    mem_limit: 2200m
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Django + Channels (ASGI, served by Daphne)
  # ---------------------------------------------------------------
  django:
    <<: *common-env
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    image: dctd-python:latest
    container_name: dctd-django
    command: ["bash", "/app/docker/django/entrypoint.sh"]
    ports:
      - "8000:8000"            # Web dashboard: http://localhost:8000
    volumes:
      - ./:/app
    depends_on:
      init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    mem_limit: 450m
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Simulated security log generator (Kafka producer)
  # Starts in "paused" mode. Press START on the Ingestion page.
  # ---------------------------------------------------------------
  generator:
    <<: *common-env
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    image: dctd-python:latest
    container_name: dctd-generator
    command: ["python", "/app/scripts/generate_logs.py"]
    volumes:
      - ./:/app
    depends_on:
      kafka:
        condition: service_healthy
      django:
        condition: service_started
    mem_limit: 192m
    restart: unless-stopped

volumes:
  hdfs-name:
  hdfs-data:
  kafka-data:
  es-data:
  mongo-data:
